; =======================
; COM port settings
; =======================
[COMPORT]
name = COM11
baudrate = 9600
parity = N
bytesize = 8
stopbits = 1
; The read/write timeout (seconds)
; The value must be longer than the execution time of the Peel command.
timeout = 90

; =======================
; HTTP settings
; =======================
[HTTP]
port = 8000

; =======================
; Application config
; =======================
[APPLICATION]
; Whether treat warnings returned by the instrument as errors.
treat_warnings_as_errors = False